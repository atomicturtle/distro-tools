# Research Apollo + Errata on db1.
# apollo.research.atomicorp.com  -> Carbon UI + API (hypercorn :8000)
# errata.research.atomicorp.com  -> Errata SPA, /api/v2 proxied to Apollo
# db1.atomicorp.com              -> alias of Apollo (legacy)
#
# TLS: Let's Encrypt via certbot webroot (/var/www/html).
# Do not proxy Temporal or Postgres.
#
# Parallel catalog crawls against these public names may 403 at the Atomicorp
# WAF in front of research.atomicorp.com. Fidelity / updateinfo scanners must
# use http://127.0.0.1:8000 on this host (bypass TLS + WAF). DNS cutover of
# apollo.build.resf.org / errata.rockylinux.org does not publish yum
# updateinfo; RelEng still writes in-repo XML independently.

Listen 80
Listen 443 https

<VirtualHost *:80>
    ServerName apollo.research.atomicorp.com
    ServerAlias errata.research.atomicorp.com db1.atomicorp.com
    DocumentRoot /var/www/html
    <Directory "/var/www/html">
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteRule ^/\.well-known/acme-challenge/ - [L]
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName apollo.research.atomicorp.com
    ServerAlias db1.atomicorp.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/apollo.research.atomicorp.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/apollo.research.atomicorp.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # v3 cve= list prefetch can exceed the default 60s proxy timeout
    Timeout 180
    ProxyTimeout 180

    # RH-shaped CSAF provider tree (static + directory indexes).
    # Must be excluded from the catch-all ProxyPass below.
    Alias /csaf /home/sshinn/apollo/csaf
    <Directory "/home/sshinn/apollo/csaf">
        Options +Indexes +FollowSymLinks -MultiViews
        IndexOptions FancyIndexing HTMLTable NameWidth=* SuppressDescription
        AllowOverride None
        Require all granted
    </Directory>
    ProxyPass /csaf !

    ProxyPass / http://127.0.0.1:8000/ connectiontimeout=10 timeout=180
    ProxyPassReverse / http://127.0.0.1:8000/
</VirtualHost>

<VirtualHost *:443>
    ServerName errata.research.atomicorp.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/apollo.research.atomicorp.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/apollo.research.atomicorp.com/privkey.pem

    DocumentRoot /var/www/errata-spa
    <Directory "/var/www/errata-spa">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    Timeout 180
    ProxyTimeout 180
    # SPA uses am="/api" then /v2/advisories → /api/v2/advisories
    ProxyPass /api/v2 http://127.0.0.1:8000/v2 connectiontimeout=10 timeout=180
    ProxyPassReverse /api/v2 http://127.0.0.1:8000/v2
    ProxyPass /api/v3 http://127.0.0.1:8000/api/v3 connectiontimeout=10 timeout=180
    ProxyPassReverse /api/v3 http://127.0.0.1:8000/api/v3
    # FastAPI slash-redirects drop the /api prefix; keep /v2 working too
    ProxyPass /v2 http://127.0.0.1:8000/v2 connectiontimeout=10 timeout=180
    ProxyPassReverse /v2 http://127.0.0.1:8000/v2
</VirtualHost>
